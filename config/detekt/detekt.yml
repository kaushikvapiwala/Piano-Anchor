# Built on detekt defaults (buildUponDefaultConfig = true). Every override needs a reason.
naming:
  FunctionNaming:
    # Compose @Composable functions are PascalCase.
    ignoreAnnotated: ['Composable']
style:
  MagicNumber:
    # Thresholds belong in engine Tunables (documented); tests may use literal values.
    excludes: ['**/*Test/**', '**/test/**']
  WildcardImport:
    active: true
complexity:
  TooManyFunctions:
    # detekt's default test excludes, plus testing/: its contract tests (one function per case) and fakes (whole
    # ports) live in main source sets.
    excludes: ['**/test/**', '**/*Test/**', '**/testing/src/**']
  LongParameterList:
    ignoreAnnotated: ['Composable']
