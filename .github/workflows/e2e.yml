# Emulator end-to-end test (docs/adr/0021-emulator-end-to-end-tests.md): the C-D-E walking skeleton on a Gradle
# Managed Device, fed by a virtual MIDI piano. Runs on main and nightly, and on the PRs that change the test itself;
# ordinary PRs never run it. Not a required check. Actions are pinned to commit SHAs like the other workflows.
name: E2E

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/e2e.yml
      - app-android/src/androidTest/**
      - app-android/src/debug/**
      - app-android/build.gradle.kts
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  emulator:
    name: Emulator end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25
      # Also validates the Gradle wrapper checksum.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # Hardware acceleration for the emulator: let the runner user open /dev/kvm.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: End-to-end test on the managed device
        run: >-
          ./gradlew :app-android:atdPixelDebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-reports
          path: |
            app-android/build/reports/
            app-android/build/outputs/androidTest-results/
          retention-days: 7
