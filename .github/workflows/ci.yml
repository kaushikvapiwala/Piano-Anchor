# Required checks for every pull request. Actions are pinned to commit SHAs (supply-chain safety);
# Dependabot keeps them current.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on PR branches only; every push to main runs to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25
      # Also validates the Gradle wrapper checksum.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # Guard: ciBuild once ran only the root project's checks, silently skipping every module's tests.
      - name: ciBuild covers every module
        run: |
          plan="$(./gradlew ciBuild --dry-run --quiet)"
          missing=0
          for module in $(sed -n 's/^ *"\(:[^"]*\)",\{0,1\}$/\1/p' settings.gradle.kts); do
            for task in check fastCheck; do
              if ! grep -q "^$module:$task SKIPPED$" <<<"$plan"; then
                echo "::error::ciBuild does not run $module:$task. Add the module's checks to ciBuild in build.gradle.kts."
                missing=1
              fi
            done
          done
          exit "$missing"
      - name: fastCheck, check, build apps
        run: ./gradlew ciBuild --continue
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: "**/build/reports/"
          retention-days: 7

  pr-conventions:
    name: PR conventions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The PR title becomes the squash commit on main, so it must follow Conventional Commits.
      - name: Conventional Commit title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::PR title must follow Conventional Commits, e.g. 'feat(engine): add wait-mode matcher'. Got: $TITLE"
            exit 1
          fi
      # Developer Certificate of Origin: every commit needs a matching Signed-off-by (git commit -s).
      - name: DCO sign-off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author="$(git log -1 --format='%an <%ae>' "$sha")"
            if ! git log -1 --format='%B' "$sha" | grep -Fqx "Signed-off-by: $author"; then
              echo "::error::Commit $sha is missing 'Signed-off-by: $author'. Fix with: git commit --amend -s (or git rebase --signoff)."
              missing=1
            fi
          done
          exit "$missing"
