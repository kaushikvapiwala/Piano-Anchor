# Tag-driven release (docs/RELEASING.md): pushing a tag vX.Y.Z runs ciBuild, builds the signed and minified release APK,
# smoke-tests it on an emulator and publishes a GitHub Release. Actions are pinned to commit SHAs like the other
# workflows. Only `publish` may write to the repository.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release again, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build, sign and verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check the tag
        id: version
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::Tag must look like vX.Y.Z, got: $TAG"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25
      # Also validates the Gradle wrapper checksum.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Check the signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret ANDROID_$name is missing. Set up signing first: docs/RELEASING.md, step 1."
              missing=1
            fi
          done
          exit "$missing"
      - name: CI build
        run: ./gradlew ciBuild --continue
      - name: Decode the keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Build the signed release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        # No configuration cache: it would store the signing passwords read at configuration time on disk.
        run: ./gradlew :app-android:assembleRelease --no-configuration-cache "-PpianoanchorVersion=$VERSION"
      - name: Verify the signature and compute the SHA-256
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir dist
          cp app-android/build/outputs/apk/release/app-android-release.apk "dist/piano-anchor-$VERSION.apk"
          apksigner="$(printf '%s\n' "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          "$apksigner" verify --verbose --print-certs "dist/piano-anchor-$VERSION.apk"
          (cd dist && sha256sum "piano-anchor-$VERSION.apk" | tee "piano-anchor-$VERSION.apk.sha256")
      - name: Delete the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-apk
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # The end-to-end test needs the debug-only virtual piano, so it cannot run against the release build. This installs
  # the release APK on an emulator, launches it and checks that Onboarding or Today renders (it would show a crash
  # or an R8 problem, such as a missing Koin or serializer class, instead).
  smoke:
    name: Smoke test on an emulator
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-apk
          path: dist
      # Hardware acceleration for the emulator: let the runner user open /dev/kvm.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start the emulator
        run: |
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin"
          image='system-images;android-36;aosp_atd;x86_64'
          yes | "$sdk/sdkmanager" --licenses > /dev/null
          "$sdk/sdkmanager" "$image" emulator platform-tools > /dev/null
          echo no | "$sdk/avdmanager" create avd --name smoke --package "$image" --device pixel_6
          nohup "$ANDROID_HOME/emulator/emulator" -avd smoke -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          adb="$ANDROID_HOME/platform-tools/adb"
          "$adb" wait-for-device
          until [ "$("$adb" shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; do sleep 5; done
      - name: Install, launch and check the first screen
        run: |
          adb="$ANDROID_HOME/platform-tools/adb"
          package=io.github.kaushikvapiwala.pianoanchor
          "$adb" install dist/piano-anchor-*.apk
          "$adb" logcat -c
          activity="$("$adb" shell cmd package resolve-activity --brief "$package" | tail -n 1 | tr -d '\r')"
          "$adb" shell am start -W -n "$activity"
          for _ in $(seq 1 24); do
            sleep 5
            # A stale dump from an earlier round must not pass, and a dump fails while the UI is still settling.
            "$adb" shell rm -f /sdcard/ui.xml
            "$adb" shell uiautomator dump /sdcard/ui.xml > /dev/null || true
            if "$adb" shell pidof "$package" > /dev/null &&
              "$adb" shell cat /sdcard/ui.xml 2> /dev/null |
              grep -Eq 'Press any key on your piano|Practised [0-9]+ of the last'; then
              echo "The first screen rendered."
              exit 0
            fi
          done
          echo "::error::Neither Onboarding nor Today rendered."
          "$adb" shell cat /sdcard/ui.xml || true
          "$adb" logcat -d -s AndroidRuntime:E
          exit 1

  publish:
    name: Publish the GitHub Release
    needs: [build, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-apk
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          apk="piano-anchor-$VERSION.apk"
          sha="$(cut -d ' ' -f 1 "dist/$apk.sha256")"
          previous="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$TAG^" 2>/dev/null || true)"
          range="${previous:+$previous..}$TAG"
          git log --no-merges --format='%s' "$range" > subjects.txt

          # Notes: Conventional Commit subjects since the previous tag, grouped feat, fix, other.
          section() { # title, grep pattern, -v for "everything else"
            if [ "$3" = -v ]; then list="$(grep -Ev "$2" subjects.txt || true)"; else list="$(grep -E "$2" subjects.txt || true)"; fi
            if [ -n "$list" ]; then
              printf '### %s\n\n' "$1"
              printf '%s\n' "$list" | sed 's/^/- /'
              printf '\n'
            fi
          }
          {
            echo "## What changed"
            echo
            section Features '^feat(\(.*\))?!?: '
            section Fixes '^fix(\(.*\))?!?: '
            section Other '^(feat|fix)(\(.*\))?!?: ' -v
            echo "## SHA-256"
            echo
            echo "\`$sha\`  \`$apk\`"
            echo
            echo "## Install"
            echo
            echo "1. Download \`$apk\` on your Android phone (Android 12 or newer)."
            echo "2. Open it. When Android asks, allow installs from this source (your browser or file manager)."
            echo "3. Optional: check the SHA-256 above with a checksum app before you install."
          } > notes.md

          # No --prerelease, even for 0.x: the update check reads /releases/latest, which skips pre-releases.
          # A rerun updates the release of the same tag in place, so the tag never goes without one.
          if gh release view "$TAG" --repo "$REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "dist/$apk" "dist/$apk.sha256" --repo "$REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$REPOSITORY" --title "Piano Anchor $VERSION" --notes-file notes.md
          else
            gh release create "$TAG" "dist/$apk" "dist/$apk.sha256" --repo "$REPOSITORY" \
              --verify-tag --title "Piano Anchor $VERSION" --notes-file notes.md
          fi
