# Security and supply-chain checks. Actions are pinned to commit SHAs; Dependabot keeps them current.
name: Security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  # Cancel superseded runs on PR branches only; every push to main runs to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Gradle dependencies come from the snapshot that dependency-graph(-submit).yml submits for
      # the PR head SHA. It lands a few minutes after this job starts, so retry until it exists.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          # The project is Apache-2.0: shipped dependencies must use one of these licences
          # (no GPL/AGPL/LGPL; see CONTRIBUTING.md). A package may pass under an OR expression.
          allow-licenses: >-
            Apache-2.0, MIT, MIT-0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD,
            EPL-1.0, EPL-2.0, MPL-2.0, CC0-1.0, Unlicense, Unicode-3.0, Unicode-DFS-2016
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 900

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Official image (bundles shellcheck), pinned by digest.
      - name: Lint workflows
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
