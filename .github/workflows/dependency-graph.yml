# Generates the Gradle dependency graph with read-only permissions and uploads it as an artifact.
# dependency-graph-submit.yml submits it, so this also works for pull requests from forks.
name: Dependency graph

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dependency-graph-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate dependency graph
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          dependency-graph: generate-and-upload
          artifact-retention-days: 1
          # Only what ships: the release APK and the desktop app. Build plugins and test
          # classpaths are not distributed, so they stay out of the licence and advisory review.
          dependency-graph-include-projects: '^:app-(android|desktop)$'
          dependency-graph-include-configurations: '^(releaseRuntimeClasspath|runtimeClasspath)$'
